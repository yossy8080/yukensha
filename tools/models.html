<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>府省の物体の一覧（確認用）</title>
<style>
  body { margin: 0; background: #04080f; color: #cfd9e6; font: 14px/1.6 sans-serif; }
  h1 { font-size: 16px; font-weight: 700; margin: 12px 16px 4px; }
  p { margin: 0 16px 8px; color: #8fa3bb; }
  canvas { display: block; width: 100vw; height: calc(100vh - 70px); }
  .labels { position: absolute; left: 0; top: 70px; width: 100vw; height: calc(100vh - 70px); display: grid; grid-template-columns: repeat(5, 1fr); pointer-events: none; }
  .labels span { padding: 6px 10px; font-size: 13px; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<h1>府省の物体の一覧（確認用・トップには出ません）</h1>
<p>data/sources.json の model キーごとの形。トップでは同じ点の数で、この形のあいだを変形します。</p>
<canvas id="c"></canvas>
<div class="labels" id="labels"></div>
<script type="module">
import * as THREE from "three";
import { buildModel, sampleModel, MODEL_KEYS } from "../assets/models3d.js";

const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
const cols = 5, rows = Math.ceil(MODEL_KEYS.length / cols);
document.getElementById("labels").style.gridTemplateRows = `repeat(${rows}, 1fr)`;
document.getElementById("labels").innerHTML = MODEL_KEYS.map((k) => `<span>${k}</span>`).join("");
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 50);
camera.position.set(0, 0.6, 6.2);
camera.lookAt(0, 0, 0);
const items = MODEL_KEYS.map((key, i) => {
  const m = buildModel(key);
  const scene = new THREE.Scene();
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(sampleModel(m, 9000, i + 1), 3));
  const group = new THREE.Group();
  group.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xcfe2ff, size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false })));
  group.add(new THREE.LineSegments(m.edges, new THREE.LineBasicMaterial({ color: 0x8fd0ff, transparent: true, opacity: 0.16, blending: THREE.AdditiveBlending, depthWrite: false })));
  scene.add(group);
  return { scene, group };
});
function draw(t) {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  renderer.setScissorTest(true);
  const cw = w / cols, ch = h / rows;
  camera.aspect = cw / ch;
  camera.updateProjectionMatrix();
  items.forEach((it, i) => {
    const x = (i % cols) * cw, y = h - (Math.floor(i / cols) + 1) * ch;
    renderer.setViewport(x, y, cw, ch);
    renderer.setScissor(x, y, cw, ch);
    it.group.rotation.y = Math.sin(t * 0.0004 + i) * 0.4;
    renderer.render(it.scene, camera);
  });
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
