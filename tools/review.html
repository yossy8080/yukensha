<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/"><!-- 写真の src（assets/photos/…）を /review/ からでも正しく読むため -->
<title>有権者 — 管理ページ</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
  .review-bar { position: sticky; top: 0; z-index: 6; background: var(--ink); color: var(--paper); }
  .review-bar .wrap { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; padding-top: 10px; padding-bottom: 10px; }
  .review-bar strong { font-family: var(--serif); font-size: 18px; letter-spacing: .06em; }
  .review-bar button, .bulk button { font: inherit; font-weight: 700; padding: 10px 18px; min-height: 44px; border: 0; border-radius: 3px; cursor: pointer; }
  .review-bar .go { background: var(--accent); color: #fff; }
  .review-bar .go:disabled { opacity: .5; cursor: default; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--ink); margin: 18px 0 0; overflow-x: auto; }
  .tabs button { font: inherit; font-weight: 700; background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 16px; min-height: 44px; cursor: pointer; white-space: nowrap; color: var(--muted); }
  .tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs .n { font-weight: 400; font-size: 13px; margin-left: 4px; }
  .panel[hidden] { display: none; }
  .bulk { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 8px; }
  .bulk button { background: var(--paper-2); border: 1px solid var(--rule); font-weight: 400; }
  .draft { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px; border-bottom: 1px solid var(--rule); padding: 8px 0; }
  .draft .item { border: 0; }
  @media (max-width: 760px) { .draft { grid-template-columns: 1fr; gap: 0; } }
  .controls { padding-top: 22px; font-size: 14px; }
  .controls fieldset { border: 0; margin: 0 0 10px; padding: 0; }
  .controls label { display: flex; align-items: center; gap: 8px; min-height: 36px; cursor: pointer; }
  .controls input { width: 18px; height: 18px; accent-color: var(--accent); }
  .controls .edit-btn { font: inherit; background: none; border: 1px solid var(--rule); padding: 6px 12px; cursor: pointer; min-height: 36px; }
  .draft[data-state="approve"] { background: linear-gradient(90deg, rgba(178,58,43,.06), transparent 60%); }
  .draft[data-state="reject"] .item, .draft[data-state="unpublish"] .item { opacity: .4; }
  .draft[data-dirty="1"] .controls::before { content: "変更あり"; display: inline-block; font-size: 12px; color: #fff; background: var(--accent); padding: 0 8px; margin-bottom: 8px; }
  .editor { display: none; margin: 0 0 22px; }
  .editor.open { display: block; }
  .editor label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .editor input, .editor textarea { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--rule); background: #fff; }
  .editor textarea { min-height: 90px; }
  .rw-badge { display: inline-block; margin: 22px 0 0; padding: 4px 12px; background: var(--ink); color: var(--paper); font-weight: 700; font-size: 14px; }
  .rw-now { margin: 0 0 22px; border: 1px dashed var(--rule); padding: 0 14px; }
  .rw-now summary { cursor: pointer; padding: 10px 0; min-height: 36px; color: var(--muted); }
  .rw-now .item { opacity: .75; }
  .rw-count { align-self: center; color: var(--muted); font-size: 14px; }
  .msg { padding: 14px 16px; background: var(--paper-2); border: 1px solid var(--rule); margin: 16px 0; }
  .filter { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 18px 0 6px; font-size: 14px; }
  .filter input, .filter select { font: inherit; padding: 8px 10px; border: 1px solid var(--rule); background: #fff; min-height: 40px; }
  .filter input { flex: 1 1 220px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); border-top: 1px solid var(--ink); margin: 20px 0; }
  .stats div { padding: 14px 0; border-bottom: 1px solid var(--rule); }
  .stats b { display: block; font-family: var(--serif); font-size: 28px; }
  .stats span { color: var(--muted); font-size: 13px; }
  /* 写真の確認 */
  .ph-badge { display: inline-block; margin: 0 0 8px; padding: 0 8px; font-size: 12px; font-weight: 700; color: #1a1205; background: #f0b84a; }
  .ph-review { margin: 0 0 22px; border-top: 1px dashed var(--rule); padding-top: 12px; }
  .ph-review h4 { margin: 0 0 8px; font-size: 14px; color: var(--muted); font-weight: 700; }
  .ph { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
  @media (max-width: 560px) { .ph { grid-template-columns: 1fr; } }
  .ph img { width: 240px; max-width: 100%; height: 160px; object-fit: cover; border-radius: 6px; background: var(--paper-2); }
  .ph-missing img { display: none; }
  .ph-missing .ph-thumb::after { content: "画像ファイルが見つかりません"; display: block; padding: 20px 10px; color: var(--accent); border: 1px dashed var(--accent); border-radius: 6px; }
  .ph p { margin: 0 0 4px; line-height: 1.6; }
  .ph-meta, .ph code { color: var(--muted); font-size: 12px; }
  .ph label { display: flex; align-items: center; gap: 8px; min-height: 36px; cursor: pointer; }
  .ph input { width: 18px; height: 18px; accent-color: var(--accent); }
  .ph-state { font-weight: 700; }
  .ph[data-ok="1"] .ph-state { color: #7fd69a; }
  .ph[data-ok="0"] .ph-state { color: #f0b84a; }
  .ph-del { font: inherit; font-size: 13px; background: none; color: var(--text); border: 1px solid var(--rule); padding: 4px 12px; min-height: 36px; cursor: pointer; margin-top: 4px; }
</style>
</head>
<body>
<div class="review-bar">
  <div class="wrap">
    <strong>有権者　管理ページ</strong>
    <span id="tally"></span>
    <button class="go" id="go" disabled>保存して公開サイトに反映</button>
  </div>
</div>
<main class="wrap" style="padding-top:0">
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="drafts" aria-selected="true">下書き<span class="n" id="n-drafts"></span></button>
    <button role="tab" data-tab="news" aria-selected="false">公開済み<span class="n" id="n-news"></span></button>
    <button role="tab" data-tab="opinion" aria-selected="false">オピニオン<span class="n" id="n-op"></span></button>
    <button role="tab" data-tab="stats" aria-selected="false">アクセス数</button>
  </div>
  <div id="msg"></div>

  <section class="panel" id="panel-drafts">
    <p class="lead" style="margin-top:16px">AIが書いた下書きです。出典リンクで内容が正しいか確かめて、「公開する」「公開しない」を選んでください。何も選ばなかったものは下書きのまま残ります。</p>
    <div class="bulk">
      <button data-all="approve">全部「公開する」にする</button>
      <button data-all="later">全部「あとで」に戻す</button>
      <button id="rw-all" hidden>書き直しをすべて『公開する』にする</button>
      <button id="ph-all-lic" hidden>表示中の写真のライセンスOKをすべてチェック</button>
      <span class="rw-count" id="rw-count"></span>
    </div>
    <div id="drafts"></div>
  </section>

  <section class="panel" id="panel-news" hidden>
    <p class="lead" style="margin-top:16px">いまサイトに出ている記事です。文章の修正、「国全体」に載せるかの切り替え、非公開に戻すことができます。非公開にした記事は消えずに、PCの中（drafts/unpublished.json）に残ります。</p>
    <div class="filter">
      <input id="q" type="search" placeholder="見出し・要約で探す">
      <select id="fm"><option value="">すべての省庁</option></select>
    </div>
    <div id="news"></div>
  </section>

  <section class="panel" id="panel-opinion" hidden>
    <p class="lead" style="margin-top:16px">毎週の「今週の論点」などの下書きです。内容を確かめて「公開する」「公開しない」を選んでください。</p>
    <div id="opinion"></div>
  </section>

  <section class="panel" id="panel-stats" hidden>
    <div id="stats"></div>
  </section>
</main>
<script src="/assets/app.js"></script>
<script>
let sources = {}, drafts = [], news = [], opDrafts = [], tab = "drafts";
const ostate = {};  // オピニオン: id -> approve | reject | later
const state = {};   // 下書き: id -> approve | reject | later
const edits = {};   // 下書き: id -> {title, summary, explain, points, featured}
const nstate = {};  // 公開済み: id -> keep | unpublish
const nedits = {};  // 公開済み: id -> {...}

function editorHtml(d) {
  return `<div class="editor">
    <label>見出し</label><input class="e-title" value="${Y.esc(d.title)}">
    <label>要約</label><textarea class="e-summary">${Y.esc(d.summary)}</textarea>
    <label>背景の説明（1行に1つ「質問｜答え」）</label><textarea class="e-explain">${Y.esc((d.explain || []).map((x) => `${x.q || ""}｜${x.a || ""}`).join("\n"))}</textarea>
    <label>ポイント（1行に1つ）</label><textarea class="e-points">${Y.esc((d.points || []).join("\n"))}</textarea>
  </div>`;
}

// 「質問｜答え」の行 → [{q, a}]（半角の | でもよい。区切りが無い行は質問だけ）
function parseExplain(text) {
  return text.split("\n").map((x) => x.trim()).filter(Boolean).map((line) => {
    const i = line.search(/[｜|]/);
    return i < 0 ? { q: line, a: "" } : { q: line.slice(0, i).trim(), a: line.slice(i + 1).trim() };
  });
}

// 公開済みと同じ id の下書き＝「書き直し」（公開すると元の記事を置きかえる）
function rewriteOf(id) { return news.find((n) => n.id === id); }

function rewriteHtml(pub) {
  // 下書きと同じ id が2つ並ばないよう、公開版の article からは id を外す
  return `<details class="rw-now"><summary>いまの公開版を見る</summary>${Y.article(pub, sources).replace(/ id="[^"]*"/, "")}</details>`;
}

// 写真の確認欄（サイトに出るのは「ライセンスOK」かつ「人物なし／人物OK」の写真だけ）
function photosHtml(d) {
  const ps = Array.isArray(d.photos) ? d.photos : [];
  if (!ps.length) return "";
  return `<div class="ph-review"><h4>写真（${ps.length}枚）</h4>${ps.map((p, i) => {
    const ok = Y.photoOk(p), people = p.people !== false;
    return `<div class="ph" data-i="${i}" data-ok="${ok ? 1 : 0}">
      <div class="ph-thumb"><img src="${Y.esc(p.src)}" alt="" loading="lazy" onerror="this.closest('.ph').classList.add('ph-missing')"></div>
      <div>
        <p>${Y.esc(p.alt || "（説明なし）")}</p>
        <p class="ph-meta">${Y.esc(p.credit || "（クレジットなし）")}｜ライセンス：${Y.esc(p.license || "（未記入）")}｜${p.page_url ? `<a href="${Y.esc(p.page_url)}" target="_blank" rel="noopener">出典ページ ↗</a>` : "出典ページなし"}<br><code>${Y.esc(p.src)}</code></p>
        <label><input type="checkbox" class="ph-lic" ${p.ok_license === true ? "checked" : ""}> ライセンスOK（出典を確認した）</label>
        ${people ? `<label><input type="checkbox" class="ph-ppl" ${p.ok_people === true ? "checked" : ""}> 人物OK（肖像の問題なし）</label>` : `<p class="ph-meta">人物なし</p>`}
        <p class="ph-state">${ok ? "サイトに出ます" : "まだサイトに出ません"}</p>
        <button class="ph-del" type="button">この写真を外す</button>
      </div>
    </div>`;
  }).join("")}</div>`;
}

function draftCard(d0) {
  const d = { ...d0, ...(edits[d0.id] || {}) }, s = state[d.id] || "later", pub = rewriteOf(d.id);
  const noPhoto = !(d.photos || []).some(Y.photoOk);
  return `<section class="draft" data-kind="draft" data-id="${Y.esc(d.id)}" data-state="${s}">
      <div class="controls">
        ${noPhoto ? `<p class="ph-badge">写真なし</p>` : ""}
        <fieldset>
          <label><input type="radio" name="s-${d.id}" value="approve" ${s === "approve" ? "checked" : ""}> 公開する</label>
          <label><input type="radio" name="s-${d.id}" value="reject" ${s === "reject" ? "checked" : ""}> 公開しない</label>
          <label><input type="radio" name="s-${d.id}" value="later" ${s === "later" ? "checked" : ""}> あとで</label>
        </fieldset>
        <label><input type="checkbox" class="feat" ${d.featured ? "checked" : ""}> 国全体のページにも載せる</label>
        <p><button class="edit-btn" type="button">文章を直す</button></p>
      </div>
      <div>${pub ? `<p class="rw-badge">書き直し（公開中の記事を置きかえ）</p>` : ""}${Y.article(d, sources)}${photosHtml(d)}${pub ? rewriteHtml(pub) : ""}${editorHtml(d)}</div>
    </section>`;
}

function newsCard(n0) {
  const n = { ...n0, ...(nedits[n0.id] || {}) }, s = nstate[n.id] || "keep";
  const dirty = nedits[n.id] || s === "unpublish" ? 1 : 0;
  const pub = n0.published_at ? `公開：${n0.published_at.slice(5, 16).replace("T", " ")}` : "";
  return `<section class="draft" data-kind="news" data-id="${Y.esc(n.id)}" data-state="${s}" data-dirty="${dirty}">
      <div class="controls">
        <fieldset>
          <label><input type="radio" name="n-${n.id}" value="keep" ${s === "keep" ? "checked" : ""}> 公開したまま</label>
          <label><input type="radio" name="n-${n.id}" value="unpublish" ${s === "unpublish" ? "checked" : ""}> 非公開に戻す</label>
        </fieldset>
        <label><input type="checkbox" class="feat" ${n.featured ? "checked" : ""}> 国全体のページに載せる</label>
        <p><button class="edit-btn" type="button">文章を直す</button></p>
        <p style="color:var(--muted);font-size:12px">${Y.esc(pub)}<br><a href="https://yossy8080.github.io/yukensha/ministries.html?m=${Y.esc(n.ministry)}#${Y.esc(n.id)}" target="_blank" rel="noopener">公開サイトで見る</a></p>
      </div>
      <div>${Y.article(n, sources)}${photosHtml(n)}${editorHtml(n)}</div>
    </section>`;
}

function renderDrafts() {
  const box = document.getElementById("drafts");
  const rw = drafts.filter((d) => rewriteOf(d.id)).length;
  document.getElementById("rw-all").hidden = !rw;
  document.getElementById("rw-count").textContent = rw ? `うち書き直し ${rw}件` : "";
  document.getElementById("ph-all-lic").hidden = !drafts.some((d) => (photosOf(d, edits)).length);
  box.innerHTML = !drafts.length ? Y.empty("確認待ちの下書きはありません。") : drafts.map(draftCard).join("");
}

function renderNews() {
  const q = document.getElementById("q").value.trim(), fm = document.getElementById("fm").value;
  const list = news.filter((n) => (!fm || n.ministry === fm || (n.also || []).includes(fm)) &&
    (!q || (n.title + n.summary + (n.points || []).join("")).includes(q)));
  document.getElementById("news").innerHTML = !list.length ? Y.empty("該当する記事はありません。") : list.map(newsCard).join("");
}

// 写真の一覧（直している途中ならその内容）。写真を変えるときは、この写しを直して edits に入れる
function photosOf(item, eds) {
  const e = eds[item.id];
  return ((e && e.photos) || item.photos || []).map((p) => ({ ...p }));
}

// 1つの記事の写真を変えて、そのカードだけ描き直す
function changePhotos(sec, fn) {
  const id = sec.dataset.id, [, eds] = store(sec);
  const item = (sec.dataset.kind === "news" ? news : drafts).find((x) => x.id === id);
  if (!item) return;
  const ps = photosOf(item, eds);
  fn(ps);
  eds[id] = { ...(eds[id] || {}), photos: ps };
  sec.outerHTML = sec.dataset.kind === "news" ? newsCard(item) : draftCard(item);
  tally();
}

function renderOpinion() {
  const byId = Object.fromEntries(news.map((n) => [n.id, n]));
  document.getElementById("opinion").innerHTML = !opDrafts.length ? Y.empty("確認待ちのオピニオンはありません。") : opDrafts.map((p) => {
    const s = ostate[p.id] || "later";
    return `<section class="draft" data-kind="opinion" data-id="${Y.esc(p.id)}" data-state="${s}">
      <div class="controls"><fieldset>
        <label><input type="radio" name="o-${p.id}" value="approve" ${s === "approve" ? "checked" : ""}> 公開する</label>
        <label><input type="radio" name="o-${p.id}" value="reject" ${s === "reject" ? "checked" : ""}> 公開しない</label>
        <label><input type="radio" name="o-${p.id}" value="later" ${s === "later" ? "checked" : ""}> あとで</label>
      </fieldset></div>
      <div>${Y.opinion(p, byId, sources)}</div>
    </section>`;
  }).join("");
}

async function renderStats() {
  const cfg = await Y.load("/api/config").catch(() => ({}));
  const featured = news.filter((n) => n.featured).length;
  const by = {}; news.forEach((n) => (by[n.ministry] = (by[n.ministry] || 0) + 1));
  const top = Object.entries(by).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, v]) => `${sources[k]?.name || k} ${v}件`).join("、");
  const days = new Set(news.map((n) => n.date)).size;
  const views = cfg.goatcounter
    ? `<p>ページごとの閲覧数・どこから来たか・スマホとPCの割合などは、こちらで見られます：<a href="https://${Y.esc(cfg.goatcounter)}.goatcounter.com" target="_blank" rel="noopener">${Y.esc(cfg.goatcounter)}.goatcounter.com</a></p>`
    : `<div class="placeholder"><h3>アクセス数はまだ測っていません</h3><p>GitHub Pages には、ページが何回見られたかを数える機能がありません。アクセス解析サービスを入れると、ページごとの閲覧数・どこから来たか・スマホとPCの割合などが見られるようになります。</p></div>`;
  document.getElementById("stats").innerHTML = `
    <div class="stats">
      <div><b>${news.length}</b><span>公開中の記事</span></div>
      <div><b>${featured}</b><span>国全体に載せている記事</span></div>
      <div><b>${drafts.length}</b><span>確認待ちの下書き</span></div>
      <div><b>${days}</b><span>記事がある日数</span></div>
    </div>
    <p style="color:var(--muted);font-size:14px">記事が多い省庁：${Y.esc(top || "—")}</p>
    <h2 class="section-title" style="margin-top:28px">アクセス数（閲覧数）</h2>
    ${views}`;
}

function tally() {
  let a = 0, r = 0, u = 0;
  Object.values(state).forEach((x) => { if (x === "approve") a++; if (x === "reject") r++; });
  Object.values(nstate).forEach((x) => { if (x === "unpublish") u++; });
  let oa = 0, orj = 0;
  Object.values(ostate).forEach((x) => { if (x === "approve") oa++; if (x === "reject") orj++; });
  const e = Object.keys(nedits).length, parts = [];
  if (oa) parts.push(`オピニオン公開 ${oa}件`); if (orj) parts.push(`オピニオン公開しない ${orj}件`);
  const rw = Object.keys(state).filter((k) => state[k] === "approve" && rewriteOf(k)).length;
  if (a) parts.push(`公開する ${a}件` + (rw ? `（うち書き直し ${rw}件：公開中の記事を置きかえ）` : "")); if (r) parts.push(`公開しない ${r}件`);
  // 公開・公開しないを選んでいない下書きの変更（写真の確認など）は、下書きのまま保存する
  const de = Object.keys(edits).filter((k) => !["approve", "reject"].includes(state[k])).length;
  if (de) parts.push(`下書きの変更 ${de}件`);
  if (e) parts.push(`修正 ${e}件`); if (u) parts.push(`非公開に戻す ${u}件`);
  document.getElementById("tally").textContent = parts.length ? "変更：" + parts.join("／") : "変更はまだありません";
  document.getElementById("go").disabled = !parts.length;
  document.getElementById("n-drafts").textContent = drafts.length;
  document.getElementById("n-news").textContent = news.length;
  document.getElementById("n-op").textContent = opDrafts.length || "";
}

function render() { renderDrafts(); renderNews(); renderOpinion(); if (tab === "stats") renderStats(); tally(); }
function store(sec) { return sec.dataset.kind === "news" ? [nstate, nedits] : sec.dataset.kind === "opinion" ? [ostate, {}] : [state, edits]; }

document.addEventListener("change", (e) => {
  const sec = e.target.closest(".draft"); if (!sec) return;
  const ph = e.target.closest(".ph");
  if (ph) {
    const i = +ph.dataset.i, on = e.target.checked;
    if (e.target.classList.contains("ph-lic")) return changePhotos(sec, (ps) => (ps[i].ok_license = on));
    if (e.target.classList.contains("ph-ppl")) return changePhotos(sec, (ps) => (ps[i].ok_people = on));
    return;
  }
  const id = sec.dataset.id, [st, ed] = store(sec);
  if (e.target.type === "radio") { st[id] = e.target.value; sec.dataset.state = e.target.value; }
  if (e.target.classList.contains("feat")) ed[id] = { ...(ed[id] || {}), featured: e.target.checked };
  if (sec.dataset.kind === "news") sec.dataset.dirty = nedits[id] || nstate[id] === "unpublish" ? 1 : 0;
  tally();
});
document.addEventListener("input", (e) => {
  const sec = e.target.closest(".draft"); if (!sec || !e.target.closest(".editor")) return;
  const id = sec.dataset.id, [, eds] = store(sec), ed = eds[id] = { ...(eds[id] || {}) };
  if (e.target.classList.contains("e-title")) ed.title = e.target.value;
  if (e.target.classList.contains("e-summary")) ed.summary = e.target.value;
  if (e.target.classList.contains("e-points")) ed.points = e.target.value.split("\n").map((x) => x.trim()).filter(Boolean);
  if (e.target.classList.contains("e-explain")) ed.explain = parseExplain(e.target.value);
  if (sec.dataset.kind === "news") sec.dataset.dirty = 1;
  tally();
});
document.addEventListener("click", (e) => {
  const t = e.target;
  if (t.classList.contains("edit-btn")) {
    const ed = t.closest(".draft").querySelector(".editor");
    if (ed.classList.toggle("open")) t.textContent = "直した内容をプレビュー"; else render();
  }
  if (t.dataset.all) { drafts.forEach((d) => (state[d.id] = t.dataset.all)); render(); }
  if (t.id === "rw-all") { drafts.filter((d) => rewriteOf(d.id)).forEach((d) => (state[d.id] = "approve")); render(); }
  if (t.classList.contains("ph-del")) {
    const sec = t.closest(".draft"), i = +t.closest(".ph").dataset.i;
    if (confirm("この写真を記事から外しますか？（画像ファイルは消えません）")) changePhotos(sec, (ps) => ps.splice(i, 1));
  }
  if (t.id === "ph-all-lic") {
    // 下書きタブに出ている写真すべてに「ライセンスOK」を付ける（人物OKは1枚ずつ確かめる）
    drafts.forEach((d) => {
      const ps = photosOf(d, edits);
      if (ps.some((p) => p.ok_license !== true)) edits[d.id] = { ...(edits[d.id] || {}), photos: ps.map((p) => ({ ...p, ok_license: true })) };
    });
    render();
  }
  const tb = t.closest("[data-tab]");
  if (tb) {
    tab = tb.dataset.tab;
    document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", b === tb));
    document.querySelectorAll(".panel").forEach((p) => (p.hidden = p.id !== "panel-" + tab));
    if (tab === "stats") renderStats();
  }
});
document.getElementById("q").addEventListener("input", renderNews);
document.getElementById("fm").addEventListener("change", renderNews);

document.getElementById("go").addEventListener("click", async () => {
  if (!confirm(document.getElementById("tally").textContent + "\nこの内容で保存して、公開サイトに反映します。よろしいですか？")) return;
  const btn = document.getElementById("go"); btn.disabled = true; btn.textContent = "保存中…";
  const post = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then((r) => r.json());
  const out = [];
  const approve = Object.keys(state).filter((k) => state[k] === "approve");
  const reject = Object.keys(state).filter((k) => state[k] === "reject");
  if (approve.length || reject.length || Object.keys(edits).length) {
    const j = await post("/api/publish", { approve, reject, edits });
    out.push(j.error ? "エラー：" + j.error : !j.published && !j.updated && !j.rejected ? `下書きの変更を保存しました（下書き${j.remaining}件）。` : `下書き：${j.published}件を公開、${j.updated ? `${j.updated}件を書き直し、` : ""}${j.rejected}件を公開しない（残り${j.remaining}件）。${j.git || ""}`);
  }
  // 書き直しを公開した記事は、公開済みタブでの変更を送らない（置きかえた新しい版に古い変更がかぶさるのを防ぐ）
  approve.filter(rewriteOf).forEach((k) => { delete nstate[k]; delete nedits[k]; });
  const unpublish = Object.keys(nstate).filter((k) => nstate[k] === "unpublish");
  if (unpublish.length || Object.keys(nedits).length) {
    const j = await post("/api/manage", { unpublish, edits: nedits });
    out.push(j.error ? "エラー：" + j.error : `公開済み：${j.edited}件を修正、${j.unpublished}件を非公開に戻しました。${j.git || ""}`);
  }
  const oapprove = Object.keys(ostate).filter((k) => ostate[k] === "approve");
  const oreject = Object.keys(ostate).filter((k) => ostate[k] === "reject");
  if (oapprove.length || oreject.length) {
    const j = await post("/api/publish_opinion", { approve: oapprove, reject: oreject });
    out.push(j.error ? "エラー：" + j.error : `オピニオン：${j.published}件を公開、${j.rejected}件を公開しない。${j.git || ""}`);
  }
  document.getElementById("msg").innerHTML = `<div class="msg">${out.map(Y.esc).join("<br>")} <a href="https://yossy8080.github.io/yukensha/" target="_blank" rel="noopener">公開サイトを見る</a></div>`;
  [state, edits, nstate, nedits, ostate].forEach((o) => Object.keys(o).forEach((k) => delete o[k]));
  btn.textContent = "保存して公開サイトに反映";
  await init();
});

async function init() {
  const [s, d, n, o] = await Promise.all([Y.load("/data/sources.json"), Y.load("/api/drafts"), Y.load("/api/news"), Y.load("/api/opinion_drafts")]);
  sources = Object.fromEntries(s.map((x) => [x.id, x])); drafts = d; news = n.sort(Y.byDateDesc); opDrafts = o;
  const fm = document.getElementById("fm");
  if (fm.options.length === 1) Y.visible(s).forEach((x) => fm.add(new Option(x.name, x.id)));
  render();
}
init();
</script>
</body>
