<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>有権者 — 下書きの確認</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
  .review-bar { position: sticky; top: 0; z-index: 6; background: var(--ink); color: var(--paper); }
  .review-bar .wrap { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; padding-top: 10px; padding-bottom: 10px; }
  .review-bar strong { font-family: var(--serif); font-size: 18px; letter-spacing: .06em; }
  .review-bar button, .bulk button { font: inherit; font-weight: 700; padding: 10px 18px; min-height: 44px; border: 0; border-radius: 3px; cursor: pointer; }
  .review-bar .go { background: var(--accent); color: #fff; }
  .review-bar .go:disabled { opacity: .5; cursor: default; }
  .bulk { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 8px; }
  .bulk button { background: var(--paper-2); border: 1px solid var(--rule); font-weight: 400; }
  .draft { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px; border-bottom: 1px solid var(--rule); padding: 8px 0; }
  .draft .item { border: 0; }
  @media (max-width: 760px) { .draft { grid-template-columns: 1fr; gap: 0; } }
  .controls { padding-top: 22px; font-size: 14px; }
  .controls fieldset { border: 0; margin: 0 0 10px; padding: 0; }
  .controls label { display: flex; align-items: center; gap: 8px; min-height: 36px; cursor: pointer; }
  .controls input { width: 18px; height: 18px; accent-color: var(--accent); }
  .controls .edit-btn { font: inherit; background: none; border: 1px solid var(--rule); padding: 6px 12px; cursor: pointer; min-height: 36px; }
  .draft[data-state="approve"] .controls { color: var(--ink); }
  .draft[data-state="approve"] { background: linear-gradient(90deg, rgba(178,58,43,.06), transparent 60%); }
  .draft[data-state="reject"] .item { opacity: .4; }
  .editor { display: none; margin: 0 0 22px; }
  .editor.open { display: block; }
  .editor label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .editor input, .editor textarea { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--rule); background: #fff; }
  .editor textarea { min-height: 90px; }
  .msg { padding: 14px 16px; background: var(--paper-2); border: 1px solid var(--rule); margin: 16px 0; }
</style>
</head>
<body>
<div class="review-bar">
  <div class="wrap">
    <strong>有権者　下書きの確認</strong>
    <span id="tally">読み込み中…</span>
    <button class="go" id="go" disabled>選んだ内容で公開する</button>
  </div>
</div>
<main class="wrap">
  <p class="lead" style="margin-top:20px">AIが書いた下書きです。出典リンクを開いて内容が正しいか確かめ、「公開する」「公開しない」を選んでください。何も選ばなかったものは、下書きのまま残ります。<br>
  <a href="/" target="_blank">いまの公開サイトを見る</a></p>
  <div class="bulk">
    <button data-all="approve">全部「公開する」にする</button>
    <button data-all="later">全部「あとで」に戻す</button>
  </div>
  <div id="msg"></div>
  <div id="drafts"></div>
</main>
<script src="/assets/app.js"></script>
<script>
let sources = {}, drafts = [];
const state = {};   // id -> approve | reject | later
const edits = {};   // id -> {title, summary, points, featured}

function render() {
  const box = document.getElementById("drafts");
  if (!drafts.length) { box.innerHTML = Y.empty("確認待ちの下書きはありません。"); tally(); return; }
  box.innerHTML = drafts.map((d0) => {
    const d = { ...d0, ...(edits[d0.id] || {}) };
    const s = state[d.id] || "later";
    return `
    <section class="draft" data-id="${Y.esc(d.id)}" data-state="${s}">
      <div class="controls">
        <fieldset>
          <label><input type="radio" name="s-${d.id}" value="approve" ${s === "approve" ? "checked" : ""}> 公開する</label>
          <label><input type="radio" name="s-${d.id}" value="reject" ${s === "reject" ? "checked" : ""}> 公開しない</label>
          <label><input type="radio" name="s-${d.id}" value="later" ${s === "later" ? "checked" : ""}> あとで</label>
        </fieldset>
        <label><input type="checkbox" class="feat" ${d.featured ? "checked" : ""}> 国全体のページにも載せる</label>
        <p><button class="edit-btn" type="button">文章を直す</button></p>
      </div>
      <div>
        ${Y.article(d, sources)}
        <div class="editor">
          <label>見出し</label><input class="e-title" value="${Y.esc(d.title)}">
          <label>要約</label><textarea class="e-summary">${Y.esc(d.summary)}</textarea>
          <label>ポイント（1行に1つ）</label><textarea class="e-points">${Y.esc((d.points || []).join("\n"))}</textarea>
        </div>
      </div>
    </section>`;
  }).join("");
  tally();
}

function tally() {
  const v = Object.values(state);
  const a = v.filter((x) => x === "approve").length, r = v.filter((x) => x === "reject").length;
  document.getElementById("tally").textContent = `下書き ${drafts.length}件 ／ 公開する ${a}件 ／ 公開しない ${r}件`;
  document.getElementById("go").disabled = a + r === 0;
}

document.addEventListener("change", (e) => {
  const sec = e.target.closest(".draft"); if (!sec) return;
  const id = sec.dataset.id;
  if (e.target.type === "radio") { state[id] = e.target.value; sec.dataset.state = e.target.value; tally(); }
  if (e.target.classList.contains("feat")) { edits[id] = { ...(edits[id] || {}), featured: e.target.checked }; }
});
document.addEventListener("input", (e) => {
  const sec = e.target.closest(".draft"); if (!sec) return;
  const id = sec.dataset.id, ed = edits[id] = { ...(edits[id] || {}) };
  if (e.target.classList.contains("e-title")) ed.title = e.target.value;
  if (e.target.classList.contains("e-summary")) ed.summary = e.target.value;
  if (e.target.classList.contains("e-points")) ed.points = e.target.value.split("\n").map((x) => x.trim()).filter(Boolean);
});
document.addEventListener("click", (e) => {
  if (e.target.classList.contains("edit-btn")) {
    const ed = e.target.closest(".draft").querySelector(".editor");
    if (ed.classList.toggle("open")) e.target.textContent = "直した内容をプレビュー";
    else { render(); }
  }
  if (e.target.dataset.all) { drafts.forEach((d) => (state[d.id] = e.target.dataset.all)); render(); }
});
document.getElementById("go").addEventListener("click", async () => {
  const approve = Object.keys(state).filter((k) => state[k] === "approve");
  const reject = Object.keys(state).filter((k) => state[k] === "reject");
  if (!confirm(`${approve.length}件を公開、${reject.length}件を公開しないにします。よろしいですか？`)) return;
  const r = await fetch("/api/publish", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ approve, reject, edits }) });
  const j = await r.json();
  document.getElementById("msg").innerHTML = `<div class="msg">${j.error ? "エラー：" + Y.esc(j.error) : `${j.published}件を公開しました（公開しない ${j.rejected}件、残りの下書き ${j.remaining}件）。${Y.esc(j.git || "")} <a href="/" target="_blank">サイトを見る</a>`}</div>`;
  Object.keys(state).forEach((k) => delete state[k]);
  await init();
});

async function init() {
  const [s, d] = await Promise.all([Y.load("/data/sources.json"), Y.load("/api/drafts")]);
  sources = Object.fromEntries(s.map((x) => [x.id, x])); drafts = d; render();
}
init();
</script>
</body>
</html>
